<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards PT ⇄ EN - Nuvem</title>
<style>
  :root {
    --bg-body: #f4f5f7;
    --bg-card: #ffffff;
    --bg-panel: #ffffff;
    --text-main: #222222;
    --text-muted: #666666;
    --text-light: #999999;
    --border-color: #dfe1e6;
    --border-light: #f0f1f4;
    --btn-bg: #e4e6ea;
    --btn-active-bg: #ffffff;
    --btn-active-text: #111111;
    --btn-hover: #f4f5f7;
    --btn-dark: #222222;
    --btn-dark-hover: #000000;
    --shadow: rgba(0,0,0,0.08);
    --shadow-light: rgba(0,0,0,0.04);
    --wrong-bg: #ffe5e5;
    --wrong-text: #c0392b;
    --wrong-hover: #ffd6d6;
    --right-bg: #e3f9e5;
    --right-text: #1e8449;
    --right-hover: #d4f5d8;
    --nav-bg: #e0e7ff;
    --nav-text: #3730a3;
    --nav-hover: #c7d2fe;
    --highlight: #fff3cd;
    --highlight-text: #856404;
  }

  [data-theme="dark"] {
    --bg-body: #121212;
    --bg-card: #1e1e1e;
    --bg-panel: #1e1e1e;
    --text-main: #e0e0e0;
    --text-muted: #a0a0a0;
    --text-light: #777777;
    --border-color: #333333;
    --border-light: #2a2a2a;
    --btn-bg: #2a2a2a;
    --btn-active-bg: #444444;
    --btn-active-text: #ffffff;
    --btn-hover: #333333;
    --btn-dark: #e0e0e0;
    --btn-dark-hover: #ffffff;
    --shadow: rgba(0,0,0,0.4);
    --shadow-light: rgba(0,0,0,0.2);
    --wrong-bg: #3a1c1c;
    --wrong-text: #ff7b7b;
    --wrong-hover: #4a2323;
    --right-bg: #1c3a22;
    --right-text: #7bff9b;
    --right-hover: #234a2b;
    --nav-bg: #1e1b4b;
    --nav-text: #a5b4fc;
    --nav-hover: #2e2a6b;
    --highlight: #3d3215;
    --highlight-text: #ffe08a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-body);
    color: var(--text-main);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .app { width: 100%; max-width: 640px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { font-size: 1.3rem; font-weight: 600; }
  
  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .theme-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 3px var(--shadow-light);
  }
  .theme-btn:hover { background: var(--btn-hover); }

  .direction-toggle {
    display: flex;
    background: var(--btn-bg);
    border-radius: 8px;
    padding: 3px;
  }
  .direction-toggle button {
    border: none;
    background: transparent;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text-muted);
    font-weight: 500;
  }
  .direction-toggle button.active {
    background: var(--btn-active-bg);
    color: var(--btn-active-text);
    box-shadow: 0 1px 2px var(--shadow-light);
  }

  .stats {
    display: flex;
    gap: 12px;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .stats span { background: var(--bg-card); padding: 6px 10px; border-radius: 6px; box-shadow: 0 1px 3px var(--shadow-light); }

  .cat-accordion {
    background: var(--bg-panel);
    border-radius: 12px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px var(--shadow-light);
    overflow: hidden;
    border: 2px solid transparent;
  }
  .cat-accordion.active { border-color: var(--nav-text); }
  .cat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    user-select: none;
  }
  .cat-header:hover { background: var(--btn-hover); }
  .cat-current { color: var(--nav-text); font-weight: 700; font-size: 0.9rem; }
  .cat-content {
    display: none;
    padding: 16px;
    border-top: 1px solid var(--border-light);
    background: var(--bg-card);
  }
  .cat-content.open { display: block; }
  .cat-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .cat-pill {
    padding: 6px 12px;
    border-radius: 20px;
    background: var(--btn-bg);
    color: var(--text-main);
    font-size: 0.85rem;
    cursor: pointer;
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cat-pill.active {
    background: var(--nav-bg);
    color: var(--nav-text);
    border-color: var(--nav-text);
    font-weight: 600;
  }
  .cat-pill .del-cat { color: var(--wrong-text); font-weight: bold; font-size: 1rem; line-height: 1; }
  .cat-pill .del-cat:hover { transform: scale(1.2); }
  
  .add-cat-form { display: flex; gap: 8px; }
  .add-cat-form input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 0.85rem;
    background: var(--bg-body);
    color: var(--text-main);
    outline: none;
  }
  .add-cat-form button {
    padding: 8px 16px;
    background: var(--btn-dark);
    color: var(--bg-card);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }

  .card-area { perspective: 1200px; height: 260px; margin-bottom: 16px; }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    background: var(--bg-card);
    border-radius: 16px;
    box-shadow: 0 4px 16px var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card-face.back { transform: rotateY(180deg); }
  .card-lang {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-light);
    margin-bottom: 12px;
  }
  .card-text { font-size: 1.6rem; font-weight: 600; line-height: 1.3; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .actions button {
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .actions button:active { transform: scale(0.97); }
  .btn-wrong { background: var(--wrong-bg); color: var(--wrong-text); }
  .btn-right { background: var(--right-bg); color: var(--right-text); }
  .btn-wrong:hover { background: var(--wrong-hover); }
  .btn-right:hover { background: var(--right-hover); }

  .nav-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .nav-actions button {
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    background: var(--nav-bg);
    color: var(--nav-text);
    transition: transform 0.1s;
  }
  .nav-actions button:hover { background: var(--nav-hover); }
  .nav-actions button:active { transform: scale(0.97); }

  .panel {
    background: var(--bg-panel);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px var(--shadow-light);
  }
  .panel h2 {
    font-size: 0.95rem;
    margin-bottom: 12px;
    font-weight: 600;
    color: var(--text-main);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .badge {
    background: var(--highlight);
    color: var(--highlight-text);
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 700;
  }

  .add-form { display: flex; flex-direction: column; gap: 8px; }
  .add-form input {
    padding: 10px 12px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    background: var(--bg-body);
    color: var(--text-main);
  }
  .add-form input:focus { border-color: var(--text-muted); }
  
  /* NOVO BOTÃO TRADUZIR */
  #btnTranslate {
    padding: 8px;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 600;
    margin-bottom: 4px;
    transition: transform 0.1s;
  }
  #btnTranslate:active { transform: scale(0.97); }
  #btnTranslate:disabled { opacity: 0.7; cursor: wait; }

  .add-form button#btnAdd {
    padding: 10px;
    background: var(--btn-dark);
    color: var(--bg-card);
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    font-weight: 500;
  }
  .add-form button#btnAdd:hover { background: var(--btn-dark-hover); }

  .io-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .io-row button, .io-row label {
    flex: 1;
    min-width: 120px;
    padding: 9px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: var(--text-main);
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
    font-weight: 500;
  }
  .io-row button:hover, .io-row label:hover { background: var(--btn-hover); }
  .io-row input[type="file"] { display: none; }

  .card-list { max-height: 240px; overflow-y: auto; }
  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border-light);
    font-size: 0.9rem;
    gap: 8px;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item .pair { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-item .pair b { color: var(--text-main); }
  .list-item .pair span { color: var(--text-muted); }
  
  /* BOTÕES DE EDITAR E EXCLUIR */
  .list-item button {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    padding: 4px 6px;
    border-radius: 6px;
    color: var(--text-muted);
  }
  .list-item button:hover { background: var(--btn-hover); }
  .list-item input {
    padding: 6px;
    border-radius: 4px;
    border: 1px solid var(--border-color);
    background: var(--bg-body);
    color: var(--text-main);
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--btn-dark);
    color: var(--bg-card);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 480px) {
    .card-text { font-size: 1.3rem; }
    header h1 { font-size: 1.1rem; }
    .io-row button, .io-row label { min-width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Flashcards <span style="font-size:0.7rem;color:var(--text-muted);font-weight:normal;">(Nuvem)</span></h1>
    <div class="header-controls">
      <div class="direction-toggle">
        <button id="dirPTEN" class="active">PT → EN</button>
        <button id="dirENPT">EN → PT</button>
      </div>
      <button class="theme-btn" id="themeBtn" title="Alternar Tema">🌙</button>
    </div>
  </header>

  <div class="stats">
    <span>✅ <b id="statRight">0</b></span>
    <span>❌ <b id="statWrong">0</b></span>
    <span>📚 <b id="statTotal">0</b> cards</span>
  </div>

  <div class="cat-accordion" id="catAccordion">
    <div class="cat-header" id="catHeader">
      <span>📂 Categoria Ativa: <span class="cat-current" id="catCurrent">Geral</span></span>
      <span id="catArrow" style="font-size: 0.8rem;">▼</span>
    </div>
    <div class="cat-content" id="catContent">
      <div class="cat-list" id="catList"></div>
      <div class="add-cat-form">
        <input type="text" id="inputNewCat" placeholder="Nova categoria...">
        <button id="btnAddCat">Criar</button>
      </div>
    </div>
  </div>

  <div class="card-area">
    <div class="card" id="card">
      <div class="card-face front">
        <div class="card-lang" id="langFront">Português</div>
        <div class="card-text" id="textFront">Carregando nuvem...</div>
      </div>
      <div class="card-face back">
        <div class="card-lang" id="langBack">Inglês</div>
        <div class="card-text" id="textBack">—</div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-wrong" id="btnWrong">❌ Errei</button>
    <button class="btn-right" id="btnRight">✅ Acertei</button>
  </div>

  <div class="nav-actions">
    <button id="btnPrev">⬅ Recuar</button>
    <button id="btnNext">Avançar ➡</button>
  </div>

  <div class="panel">
    <h2>➕ Adicionar card <span class="badge" id="badgeAdd">em: Geral</span></h2>
    <div class="add-form">
      <input type="text" id="inputEN" placeholder="Inglês (ex: Good morning)">
      <input type="text" id="inputPT" placeholder="Português (ex: Bom dia)">
      <button id="btnTranslate" style="background: var(--nav-bg); color: var(--nav-text);">🔄 Traduzir</button>
      <button id="btnAdd">Adicionar</button>
    </div>
  </div>

  <div class="panel">
    <h2>📁 Importar / Exportar <span class="badge" id="badgeImport">Importa para: Geral</span></h2>
    <div class="io-row">
      <button id="btnExportTxt">⬇ Exportar TXT</button>
      <label>⬆ Importar TXT<input type="file" id="fileTxt" accept=".txt"></label>
      <button id="btnExportJson">⬇ Exportar JSON</button>
      <label>⬆ Importar JSON<input type="file" id="fileJson" accept=".json"></label>
    </div>
  </div>

  <div class="panel">
    <h2>📋 Meus cards (<span id="listCount">0</span>)</h2>
    <div class="card-list" id="cardList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCeOVz5jRue8Y1Io7hAndWd-iwTlvaS9eI",
    authDomain: "entendi-flashcards.firebaseapp.com",
    projectId: "entendi-flashcards",
    storageBucket: "entendi-flashcards.firebasestorage.app",
    messagingSenderId: "181208616106",
    appId: "1:181208616106:web:dbbbb7689af03e761f94d3",
    measurementId: "G-ZFP29T103F"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  const docRef = doc(db, "flashcards", "data");

  let cards = [];
  let categories = ["Geral"]; 
  let activeCategory = "Geral"; 
  let stats = { right: 0, wrong: 0 };
  let direction = "pt-en"; 
  let deck = [];         
  let currentIndex = 0;
  let flipped = false;
  let syncTimeout = null;
  let isFirstLoad = true;

  const THEME_KEY = "flashcards_theme";

  const $ = (id) => document.getElementById(id);
  const cardEl = $("card");
  const textFront = $("textFront");
  const textBack = $("textBack");
  const langFront = $("langFront");
  const langBack = $("langBack");

  function initRealtimeListener() {
    onSnapshot(docRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        
        cards = data.cards || [];
        categories = data.categories || ["Geral"];
        stats = data.stats || { right: 0, wrong: 0 };
        
        if (data.activeCategory && categories.includes(data.activeCategory)) {
            activeCategory = data.activeCategory;
        }

        if (!categories.includes("Geral")) categories.unshift("Geral");
        cards.forEach(c => { if (!c.cat || !categories.includes(c.cat)) c.cat = "Geral"; });
        if (!categories.includes(activeCategory)) activeCategory = "Geral";
        
        updateUI();
      } else {
        saveToCloud();
      }
      isFirstLoad = false;
    }, (error) => {
      console.error("Erro no tempo real:", error);
      toast("Erro de conexão com o banco.");
    });
  }

  function saveToCloud() {
    if (isFirstLoad) return;

    if (syncTimeout) clearTimeout(syncTimeout);
    syncTimeout = setTimeout(async () => {
      try {
        await setDoc(docRef, {
          cards: cards,
          categories: categories,
          stats: stats,
          activeCategory: activeCategory
        }, { merge: true });
      } catch (e) {
        console.error("Erro ao salvar", e);
        toast("Erro ao salvar na nuvem.");
      }
    }, 800);
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  }

  function buildDeck() {
    deck = cards.filter(c => c.cat === activeCategory);
    if (currentIndex >= deck.length) currentIndex = 0;
    if (deck.length === 0) currentIndex = 0;
  }

  function renderCategories() {
    const list = $("catList");
    list.innerHTML = "";
    
    categories.forEach(cat => {
      const pill = document.createElement("div");
      pill.className = "cat-pill" + (activeCategory === cat ? " active" : "");
      
      const span = document.createElement("span");
      span.textContent = cat;
      span.style.flex = "1";
      span.onclick = () => { activeCategory = cat; saveToCloud(); updateUI(); };
      pill.appendChild(span);

      if (cat !== "Geral") {
        const del = document.createElement("span");
        del.className = "del-cat";
        del.textContent = "×";
        del.onclick = (e) => {
          e.stopPropagation();
          if (confirm(`Excluir a categoria "${cat}"?\n\nATENÇÃO: Todas as frases dentro dela também serão apagadas!`)) {
            categories = categories.filter(c => c !== cat);
            cards = cards.filter(c => c.cat !== cat); 
            if (activeCategory === cat) activeCategory = "Geral";
            saveToCloud();
            updateUI();
            toast(`Categoria "${cat}" excluída.`);
          }
        };
        pill.appendChild(del);
      }
      list.appendChild(pill);
    });
  }

  function updateUI() {
    $("catCurrent").textContent = activeCategory;
    $("badgeAdd").textContent = `em: ${activeCategory}`;
    $("badgeImport").textContent = `Importa para: ${activeCategory}`;
    
    if (activeCategory !== "Geral") {
      $("catAccordion").classList.add("active");
    } else {
      $("catAccordion").classList.remove("active");
    }
    
    buildDeck();
    renderCategories();
    updateStats();
    renderCard();
    renderList();
  }

  function updateStats() {
    $("statRight").textContent = stats.right;
    $("statWrong").textContent = stats.wrong;
    $("statTotal").textContent = cards.length;
    $("listCount").textContent = deck.length;
  }

  function renderCard() {
    if (deck.length === 0) {
      langFront.textContent = direction === "pt-en" ? "Português" : "Inglês";
      langBack.textContent = direction === "pt-en" ? "Inglês" : "Português";
      textFront.textContent = `Nenhum card em "${activeCategory}".`;
      textBack.textContent = "—";
      cardEl.classList.remove("flipped");
      flipped = false;
      return;
    }
    
    const c = deck[currentIndex];
    const frontText = direction === "pt-en" ? c.pt : c.en;
    const backText = direction === "pt-en" ? c.en : c.pt;
    langFront.textContent = direction === "pt-en" ? "Português" : "Inglês";
    langBack.textContent = direction === "pt-en" ? "Inglês" : "Português";
    textFront.textContent = frontText;
    textBack.textContent = backText;
    
    cardEl.classList.remove("flipped");
    flipped = false;
    window.speechSynthesis.cancel();
  }

  function renderList() {
    const list = $("cardList");
    list.innerHTML = "";
    
    if (deck.length === 0) {
      list.innerHTML = '<div style="color:var(--text-light);font-size:0.85rem;padding:8px 0;">Nenhum card nesta categoria.</div>';
      return;
    }

    deck.forEach((c) => {
      const realIndex = cards.findIndex(card => card.en === c.en && card.pt === c.pt && card.cat === c.cat);
      
      const div = document.createElement("div");
      div.className = "list-item";
      
      const pair = document.createElement("div");
      pair.className = "pair";
      pair.innerHTML = `<b>${escapeHtml(c.en)}</b> <span>| ${escapeHtml(c.pt)}</span>`;
      
      // BOTÃO EDITAR
      const editBtn = document.createElement("button");
      editBtn.textContent = "✏️";
      editBtn.title = "Editar";
      editBtn.onclick = () => {
        div.innerHTML = ""; // Limpa a linha atual
        
        const editEn = document.createElement("input");
        editEn.type = "text";
        editEn.value = c.en;
        editEn.style.flex = "1";
        editEn.style.marginRight = "4px";

        const editPt = document.createElement("input");
        editPt.type = "text";
        editPt.value = c.pt;
        editPt.style.flex = "1";
        editPt.style.marginRight = "4px";

        const saveBtn = document.createElement("button");
        saveBtn.textContent = "💾";
        saveBtn.title = "Salvar";
        saveBtn.style.color = "var(--right-text)";
        saveBtn.onclick = () => {
          const newEn = editEn.value.trim();
          const newPt = editPt.value.trim();
          if (!newEn || !newPt) { toast("Preencha os dois campos"); return; }
          
          if(realIndex > -1) {
            cards[realIndex].en = newEn;
            cards[realIndex].pt = newPt;
            saveToCloud(); 
            buildDeck();
            updateUI();
            toast("Card atualizado!");
          }
        };

        const cancelBtn = document.createElement("button");
        cancelBtn.textContent = "✖️";
        cancelBtn.title = "Cancelar";
        cancelBtn.style.color = "var(--wrong-text)";
        cancelBtn.onclick = () => { renderList(); };

        div.appendChild(editEn);
        div.appendChild(editPt);
        div.appendChild(saveBtn);
        div.appendChild(cancelBtn);
      };
      
      // BOTÃO EXCLUIR
      const delBtn = document.createElement("button");
      delBtn.textContent = "🗑";
      delBtn.title = "Excluir";
      delBtn.onclick = () => {
        if(realIndex > -1) {
            cards.splice(realIndex, 1);
            saveToCloud(); 
            buildDeck();
            updateUI();
            toast("Card excluído");
        }
      };
      
      div.appendChild(pair);
      div.appendChild(editBtn);
      div.appendChild(delBtn);
      list.appendChild(div);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (m) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }

  function speak(text, lang) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === "en" ? "en-US" : "pt-BR";
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }

  cardEl.addEventListener("click", (e) => {
    if (deck.length === 0) return;
    flipped = !flipped;
    cardEl.classList.toggle("flipped", flipped);
    if (flipped) {
      const c = deck[currentIndex];
      speak(c.en, "en"); 
    } else {
      window.speechSynthesis.cancel();
    }
  });

  function nextCard() {
    if (deck.length === 0) return;
    currentIndex = (currentIndex + 1) % deck.length;
    renderCard();
  }
  function prevCard() {
    if (deck.length === 0) return;
    currentIndex = (currentIndex - 1 + deck.length) % deck.length;
    renderCard();
  }

  $("btnRight").onclick = () => {
    if (deck.length === 0) return;
    stats.right++;
    saveToCloud();
    nextCard();
    updateStats();
  };
  $("btnWrong").onclick = () => {
    if (deck.length === 0) return;
    stats.wrong++;
    saveToCloud();
    nextCard();
    updateStats();
  };
  $("btnPrev").onclick = () => { if (deck.length > 0) prevCard(); };
  $("btnNext").onclick = () => { if (deck.length > 0) nextCard(); };

  $("catHeader").onclick = () => {
    const content = $("catContent");
    const arrow = $("catArrow");
    content.classList.toggle("open");
    arrow.textContent = content.classList.contains("open") ? "▲" : "▼";
  };

  $("btnAddCat").onclick = () => {
    const newCat = $("inputNewCat").value.trim();
    if (!newCat) return;
    if (categories.includes(newCat)) { toast("Categoria já existe"); return; }
    categories.push(newCat);
    activeCategory = newCat; 
    saveToCloud();
    $("inputNewCat").value = "";
    updateUI(); 
    toast(`Categoria "${newCat}" criada e ativada`);
  };
  $("inputNewCat").addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("btnAddCat").click();
  });

  $("dirPTEN").onclick = () => {
    direction = "pt-en";
    $("dirPTEN").classList.add("active");
    $("dirENPT").classList.remove("active");
    renderCard();
  };
  $("dirENPT").onclick = () => {
    direction = "en-pt";
    $("dirENPT").classList.add("active");
    $("dirPTEN").classList.remove("active");
    renderCard();
  };

  $("themeBtn").onclick = () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const newTheme = isDark ? 'light' : 'dark';
    if (newTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      $("themeBtn").textContent = '☀️';
    } else {
      document.documentElement.removeAttribute('data-theme');
      $("themeBtn").textContent = '🌙';
    }
    localStorage.setItem(THEME_KEY, newTheme);
  };

  $("btnAdd").onclick = () => {
    const en = $("inputEN").value.trim();
    const pt = $("inputPT").value.trim();
    if (!en || !pt) { toast("Preencha os dois campos"); return; }
    cards.push({ en, pt, cat: activeCategory });
    saveToCloud();
    $("inputEN").value = "";
    $("inputPT").value = "";
    $("inputEN").focus();
    buildDeck();
    updateUI();
    toast(`Card adicionado em "${activeCategory}"`);
  };
  ["inputEN", "inputPT"].forEach((id) => {
    $(id).addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("btnAdd").click();
    });
  });

  $("btnTranslate").onclick = async () => {
    const inputEN = $("inputEN");
    const inputPT = $("inputPT");
    const en = inputEN.value.trim();
    const pt = inputPT.value.trim();

    if ((!en && !pt) || (en && pt)) {
      toast("Preencha apenas um dos campos para traduzir.");
      return;
    }

    const btn = $("btnTranslate");
    const originalText = btn.textContent;
    btn.textContent = "⏳ Traduzindo...";
    btn.disabled = true;

    try {
      let textToTranslate = "";
      let langpair = "";

      if (pt) {
        textToTranslate = encodeURIComponent(pt);
        langpair = "pt|en"; 
      } else {
        textToTranslate = encodeURIComponent(en);
        langpair = "en|pt"; 
      }

      const response = await fetch(`https://api.mymemory.translated.net/get?q=${textToTranslate}&langpair=${langpair}`);
      const data = await response.json();

      if (data.responseStatus === 200 && data.responseData.translatedText) {
        let translated = data.responseData.translatedText;
        if (translated === translated.toUpperCase()) {
           translated = translated.charAt(0).toUpperCase() + translated.slice(1).toLowerCase();
        }

        if (langpair === "pt|en") {
          inputEN.value = translated;
        } else {
          inputPT.value = translated;
        }
        toast("Traduzido com sucesso!");
      } else {
        toast("Não foi possível traduzir. Tente novamente.");
      }
    } catch (error) {
      console.error("Erro na tradução:", error);
      toast("Erro de conexão ao traduzir.");
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  };

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  $("btnExportTxt").onclick = () => {
    if (cards.length === 0) { toast("Nada para exportar"); return; }
    const lines = cards.map((c) => `(${c.en} | ${c.pt} | ${c.cat})`).join("\n");
    download("flashcards.txt", lines);
    toast("TXT exportado com sucesso");
  };

  $("btnExportJson").onclick = () => {
    const data = {
      app: "flashcards",
      version: 2,
      exportedAt: new Date().toISOString(),
      cards: cards,
      categories: categories,
      stats: stats,
      direction: direction
    };
    download("flashcards.json", JSON.stringify(data, null, 2), "application/json");
    toast("JSON exportado com sucesso");
  };

  function processImport(importedCards) {
    if (importedCards.length === 0) { toast("Nenhuma frase válida encontrada"); return; }
    importedCards.forEach(c => {
      cards.push({ en: c.en, pt: c.pt, cat: activeCategory });
    });
    saveToCloud();
    buildDeck();
    updateUI();
    toast(`${importedCards.length} frase(s) importada(s) para "${activeCategory}"`);
  }

  $("fileTxt").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const text = reader.result;
      const parsed = [];
      const lines = text.split(/\r?\n/);
      
      for (let line of lines) {
        line = line.trim();
        if (!line) continue;
        line = line.replace(/^\((.*)\)$/, "$1").trim();
        const parts = line.split("|");
        if (parts.length >= 2) {
          const en = parts[0].trim();
          const pt = parts[1].trim();
          if (en && pt) parsed.push({ en, pt });
        }
      }
      processImport(parsed);
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  $("fileJson").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        let importedCards = [];
        if (Array.isArray(data)) importedCards = data;
        else if (data && Array.isArray(data.cards)) importedCards = data.cards;

        importedCards = importedCards
          .filter(c => c && (c.en || c.pt))
          .map(c => ({ 
            en: String(c.en || ""), 
            pt: String(c.pt || "")
          }))
          .filter(c => c.en && c.pt);

        processImport(importedCards);
      } catch (err) {
        toast("Arquivo JSON inválido");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
    $("themeBtn").textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  }

  initRealtimeListener();

</script>
</body>
</html>
